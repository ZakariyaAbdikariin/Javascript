<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page title -->
    <title>JavaScript Modules Calculator</title>

    <!-- Internal CSS -->
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        margin-top: 50px;
        background-color: #f4f4f4;
      }

      h1 {
        color: #333;
      }

      input {
        padding: 8px;
        margin: 5px;
        width: 150px;
      }

      button {
        padding: 8px 15px;
        margin: 5px;
        cursor: pointer;
        border: none;
        background-color: #007bff;
        color: white;
        border-radius: 5px;
      }

      button:hover {
        background-color: #0056b3;
      }

      #result {
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
        color: #222;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Simple Calculator Using JS Modules</h1>
    </header>

    <main>
      <section>
        <input type="number" id="num1" placeholder="First number" />
        <input type="number" id="num2" placeholder="Second number" />
      </section>

      <section>
        <button id="multiplyBtn">Multiply</button>
        <button id="divideBtn">Divide</button>
        <button id="subtractBtn">Subtract</button>
      </section>

      <section>
        <div id="result">Result:</div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 JavaScript Modules Practice</p>
    </footer>

    <!-- JavaScript Module Import -->
    <script type="module">
      import { multiply, divide, subtract } from "./math_Operations.js";

      function getNumbers() {
        const num1 = parseFloat(document.getElementById("num1").value);
        const num2 = parseFloat(document.getElementById("num2").value);
        return { num1, num2 };
      }

      function showResult(value) {
        document.getElementById("result").textContent = "Result: " + value;
      }

      document.getElementById("multiplyBtn").addEventListener("click", () => {
        const { num1, num2 } = getNumbers();
        showResult(multiply(num1, num2));
      });

      document.getElementById("divideBtn").addEventListener("click", () => {
        const { num1, num2 } = getNumbers();
        showResult(divide(num1, num2));
      });

      document.getElementById("subtractBtn").addEventListener("click", () => {
        const { num1, num2 } = getNumbers();
        showResult(subtract(num1, num2));
      });
    </script>
  </body>
</html>
